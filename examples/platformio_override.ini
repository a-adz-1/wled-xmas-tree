; Copy into the root of the WLED source folder (WLED 16+), pick one env, then:
;   pio run -e esp32dev_tree -t upload

[platformio]
default_envs = esp32dev_tree

; Classic ESP32 dev board (WROOM-32), e.g. the common 38-pin boards
[env:esp32dev_tree]
extends = env:esp32dev
custom_usermods = audioreactive https://github.com/a-adz-1/wled-xmas-tree.git

; ESP32 with 8 MB flash (e.g. QuinLED Dig-Octa, most Gledopto ESP32 controllers with 8MB)
[env:esp32_8MB_tree]
extends = env:esp32dev_8M
custom_usermods = audioreactive https://github.com/a-adz-1/wled-xmas-tree.git

; ESP32-S3 with 8 MB PSRAM
[env:esp32s3_tree]
extends = env:esp32s3dev_8MB_opi
custom_usermods = audioreactive https://github.com/a-adz-1/wled-xmas-tree.git

; Developing the usermod locally? Point at your checkout instead of GitHub:
; custom_usermods = audioreactive symlink:///home/you/Projects/wled-xmas-tree
